# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Nima Kondori
first_name: Nima
last_name: Kondori
email: nimakondori96@gmail.com
description: >
  ML scientist building agentic AI systems and generative models — from video
  diffusion for medical imaging to production ML at scale.
tagline: Building agentic AI systems that ship
role: Senior Machine Learning Scientist at Lily AI
keywords: machine learning, generative AI, diffusion models, agentic AI, MLOps, computer vision
lang: en
icon: favicon.svg

url: https://nimakondori.github.io
baseurl:

# -----------------------------------------------------------------------------
# Socials
# -----------------------------------------------------------------------------

github_username: nimakondori
linkedin_username: nima-kondori
x_username: nima_kondori
scholar_userid: 3HKikSIAAAAJ
resume_pdf: nimakondori_resume.pdf

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

# GoatCounter: free, privacy-friendly, cookie-less analytics (https://www.goatcounter.com)
enable_goatcounter: false # flip to true once goatcounter_code is set below
goatcounter_code: # your GoatCounter site code, e.g. "nimakondori" for nimakondori.goatcounter.com

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:title/

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

include: ["_pages"]
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - requirements.txt
  - node_modules/
  - vendor/

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-sitemap

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Kondori]
  first_name: [Nima]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  query: "@*"
  # Each entry renders its own year column, so scholar's year headings would duplicate it.
  group_by: none
  sort_by: year
  order: descending
