resume_pdf: nimakondori_resume.pdf

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

# GoatCounter: free, privacy-friendly, cookie-less analytics (https://www.goatcounter.com)
enable_goatcounter: false # flip to true once goatcounter_code is set below
goatcounter_code: # your GoatCounter site code, e.g. "nimakondori" for nimakondori.goatcounter.com

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:title/

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

include: ["_pages"]
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - requirements.txt
  - node_modules/
  - vendor/

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-sitemap

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Kondori]
  first_name: [Nima]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  query: "@*"
  # Each entry renders its own year column, so scholar's year headings would duplicate it.
  group_by: none
  sort_by: year
  order: descending
